[workspace]
resolver = "3"
members = ["editor", "macros", "engine", "spielwiese", "build"]

[workspace.dependencies]
bevy = { version = "0.18.0", features = ["debug"] }    
strum = "0.28"
strum_macros = "0.28"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1"
