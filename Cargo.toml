[workspace]
resolver = "3"
members = ["editor", "macros", "engine", "spielwiese", "build", "game"]

[workspace.dependencies]
bevy = { version = "0.19", features = ["debug", "serialize"] }    
strum = "0.28"
strum_macros = "0.28"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
bevy_elf = { version = "0.1.0", path = "../elf/bevy_elf", features = ["default", "image"] }
