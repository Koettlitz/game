[workspace]
resolver = "3"
members = ["editor", "macros", "engine", "spielwiese", "build", "game"]

[workspace.dependencies]
bevy = { version = "0.18", features = ["debug", "serialize", "file_watcher"] }    
strum = "0.28"
strum_macros = "0.28"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
